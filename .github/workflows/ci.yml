name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # The raw data are stored in the repository (CC BY 4.0), so every file must be there and match its checksum.
      - name: Raw data matches its checksums
        run: python -m creditrisk verify

      # The tests use made-up portfolios with known answers and a small end-to-end run, then check that the committed
      # results, documents, dashboard and notebook are consistent with each other and not out of date.
      - name: Tests
        run: pytest -q
